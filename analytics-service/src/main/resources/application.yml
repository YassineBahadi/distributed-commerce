server:
  port: 8084

spring:
  application:
    name: analytics-service

  kafka:
    bootstrap-servers: localhost:9092

    streams:
      application-id: order-analytics-app
      properties:
        default:
          key:
            serde: org.apache.kafka.common.serialization.Serdes$StringSerde
          value:
            serde: org.apache.kafka.common.serialization.Serdes$StringSerde