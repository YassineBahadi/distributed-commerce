server:
  port: 8082

spring:
  config:
    import: optional:configserver:http://localhost:8888
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/commerce_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

axon:
  axonserver:
    servers: localhost:8124

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/